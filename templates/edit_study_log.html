{% extends 'base.html' %}

{% block title %}Edit Study Session - Study Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit Study Session</h2>
    <form method="POST" action="{{ url_for('edit_study_log', log_id=log.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="subject_id">Subject</label>
            <select id="subject_id" name="subject_id" required>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}"
                        {% if subject.id == log.subject_id %}selected{% endif %}>
                        {{ subject.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="hours_spent">Hours Spent</label>
            <input type="number" id="hours_spent" name="hours_spent" 
                   step="0.5" min="0.5" max="12" value="{{ log.hours_spent }}" required>
        </div>
        
        <div class="form-group">
            <label for="study_date">Date</label>
            <input type="date" id="study_date" name="study_date" value="{{ log.study_date }}" required>
        </div>
        
        <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="3" 
                      placeholder="What did you study? Any challenges?">{{ log.notes or '' }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Update Session</button>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary"><i class="fa-solid fa-xmark"></i> Cancel</a>
    </form>
</div>
{% endblock %}
