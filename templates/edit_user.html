{% extends 'base.html' %}

{% block title %}Edit User - Study Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Edit User: {{ user.full_name }}</h2>
    <form method="POST" action="{{ url_for('admin_edit_user', user_id=user.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>
        </div>

        <div class="form-group">
            <label for="password">Password (leave blank to keep current)</label>
            <input type="password" id="password" name="password" placeholder="Enter new password or leave blank">
        </div>

        <div class="form-group">
            <label>Role</label>
            <input type="text" value="{{ user.role }}" disabled>
        </div>

        <div class="form-group">
            <label>Status</label>
            <input type="text" value="{{ user.status }}" disabled>
        </div>

        <button type="submit" class="btn btn-primary">Update User</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
