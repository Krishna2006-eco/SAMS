{% extends 'base.html' %}

{% block title %}Enter Marks - Study Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Enter Student Marks</h2>
    <form method="POST" action="{{ url_for('enter_marks') }}">
        <div class="form-group">
            <label for="student_id">Student</label>
            <select id="student_id" name="student_id" required>
                <option value="">Select a student</option>
                {% for student in students %}
                    <option value="{{ student.id }}">{{ student.full_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="subject_id">Subject</label>
            <select id="subject_id" name="subject_id" required>
                <option value="">Select a subject</option>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="exam_name">Exam Name</label>
            <input type="text" id="exam_name" name="exam_name" 
                   placeholder="e.g., Mid-Term 2025" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="marks_obtained">Marks Obtained</label>
                <input type="number" id="marks_obtained" name="marks_obtained" 
                       step="0.5" min="0" required>
            </div>
            
            <div class="form-group">
                <label for="max_marks">Maximum Marks</label>
                <input type="number" id="max_marks" name="max_marks" 
                       value="100" min="1" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Submit Marks</button>
        <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
